[env:freenove_esp32_s3_wroom]
platform = espressif32 @ 6.5.0
; --- REVERTING TO DEVKITC FOR CORRECT SERIAL & MEMORY MAPPING ---
board = esp32-s3-devkitc-1  
framework = arduino
monitor_speed = 115200

; --- EXPANDING FLASH TO 8MB ---
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

; --- FORCING 8MB OPI PSRAM TO WAKE UP ---
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_SPIRAM_BOOT_INIT=1
    -D LV_CONF_INCLUDE_SIMPLE
    ; --- PIN DEFINITIONS ---
    -D TFT_MOSI=8
    -D TFT_SCLK=11
    -D TFT_CS=15
    -D TFT_DC=16
    -D TFT_RST=17
    -D TFT_BL=18
    -D I2C_SDA=6
    -D I2C_SCL=7
    -D TOUCH_INT=9
    -D TOUCH_RST=10
    -D I2S_MIC_BCLK=4
    -D I2S_MIC_WS=5
    -D I2S_MIC_DATA=1
    -D I2S_SPK_BCLK=13
    -D I2S_SPK_LRCK=12
    -D I2S_SPK_DOUT=14

lib_deps = 
    moononournation/GFX Library for Arduino @ 1.4.0
    lvgl/lvgl @ 8.3.9
    adafruit/Adafruit MPU6050 @ ^2.2.4
    adafruit/Adafruit MLX90614 Library @ ^2.1.3
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    bblanchon/ArduinoJson @ ^6.21.3
    esphome/ESP32-audioI2S @ ^2.0.7
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP @ ^3.3.2